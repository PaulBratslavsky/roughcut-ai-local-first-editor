[package]
name = "roughcut-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RoughCut — local-first AI video editor (Tauri v2 shell wiring the core to the web frontend)."

[lib]
name = "roughcut_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# whisper-native: end users always get the in-process transcriber; the flag
# only exists so core-only builds/tests stay light (it compiles whisper.cpp).
roughcut-core = { path = "../../core", features = ["whisper-native"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
