[package]
name = "roughcut-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable core of the local-first AI video editor: models, tool registry, agent loop, adapters, MCP."

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
tokio.workspace = true
reqwest.workspace = true
axum.workspace = true
rusqlite.workspace = true
rand.workspace = true
dirs.workspace = true
async-trait.workspace = true
sha2.workspace = true
portable-pty.workspace = true
base64.workspace = true
# whisper-native: in-process whisper.cpp (no PATH dependency, real progress).
# Off by default so core builds/tests stay light; the app crate turns it on.
whisper-rs = { version = "0.16", optional = true }
hound = { version = "3.5", optional = true }
# ts-bindings: generate the frontend's TypeScript types from these structs
# (one source of truth for the model). Dev-time only.
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl"], optional = true }

[features]
whisper-native = ["dep:whisper-rs", "dep:hound"]
ts-bindings = ["dep:ts-rs"]

# whisper.cpp on the Apple GPU — CPU-only decode of a 26-min video takes
# ~10x longer and reads as a hang. Target-gated: metal exists only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }
# Face finding for 9:16 reframing: Apple's Vision framework, on-device. Same
# objc2 generation Tauri already pulls in.
# `exception`: AVFoundation reports bad configuration by throwing; catch it
# instead of aborting the app.
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSURL", "NSValue"] }
# Recording (adapters/capture.rs): AVFoundation capture sessions + the
# hardware H.264 encoder via AVAssetWriter. See ADR-0006.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "AVAssetWriter", "AVAssetWriterInput", "AVCaptureAudioDataOutput", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNDetectFaceRectanglesRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
